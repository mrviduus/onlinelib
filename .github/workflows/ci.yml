name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

# Opt JS actions into Node 24 ahead of June 2026 forced cutover.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        # pgvector image (stock pg16 + vector ext) so `dotnet ef database update`
        # can run the AddPgVectorAndChunks migration's CREATE EXTENSION vector.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: books
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Lint (format check)
        run: dotnet format --no-restore --verify-no-changes

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef

      - name: Run migrations
        run: dotnet ef database update --project backend/src/Infrastructure --startup-project backend/src/Api
        env:
          ConnectionStrings__Default: "Host=localhost;Port=5432;Database=books;Username=app;Password=changeme"

      - name: Search tests
        run: dotnet test tests/TextStack.Search.Tests --no-build

      # MCP over-the-wire integration suite (AI-053) — hermetic (loopback only, no
      # Postgres/Docker). In the solution, so --no-build reuses the Build step above.
      - name: MCP integration tests
        run: dotnet test tests/TextStack.Ai.Mcp.Tests --no-build

      # Unit tests (incl. the AI-047..050 MCP unit suites) are NOT in textstack.sln,
      # so the Build step doesn't compile them — run WITHOUT --no-build. This closes a
      # real CI gap: these were never executed by an explicit dotnet test step before.
      - name: Unit tests
        run: dotnet test tests/TextStack.UnitTests

      # AI-051: keep the MCP global-tool packaging green (no publish, no secret).
      # Owner publishes manually via `dotnet nuget push` with their nuget.org key.
      - name: Pack MCP global tool
        run: dotnet pack backend/src/Ai/TextStack.Ai.Mcp -c Release

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install & build web
        working-directory: apps/web
        run: pnpm install --frozen-lockfile && pnpm build

      # Vitest was never wired into CI — the job built the app and stopped, so a
      # failing web unit test merged to main unnoticed.
      - name: Web unit tests
        working-directory: apps/web
        run: pnpm test

      - name: Drift-check mobile overlay bundle
        working-directory: apps/web
        run: pnpm check:mobile-overlay

      - name: Install & build admin
        working-directory: apps/admin
        run: pnpm install --frozen-lockfile && pnpm build

  # apps/mobile is npm + its own lockfile, not part of the pnpm workspace, so it
  # gets its own job rather than another step in `frontend`. @textstack/shared is
  # consumed from source via Metro watchFolders + tsconfig paths, so the checkout
  # already carries it and only the app's own deps need installing.
  #
  # Not covered here: e2e. apps/mobile/e2e is Playwright driving the Expo *web*
  # build in a Pixel-sized viewport — it exercises no native code path, so running
  # it in CI would buy confidence it cannot actually provide.
  mobile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install
        working-directory: apps/mobile
        run: npm ci

      - name: Typecheck
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Unit tests
        working-directory: apps/mobile
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=app
          POSTGRES_PASSWORD=changeme
          POSTGRES_DB=books
          JWT_SECRET=test-secret-key-for-ci-minimum-32-chars
          JWT_ISSUER=textstack.app
          JWT_AUDIENCE=textstack.app
          GOOGLE_CLIENT_ID=test
          ASPNETCORE_ENVIRONMENT=Development
          EOF

      - name: Create volume dirs for non-root containers
        run: |
          mkdir -p data/storage data/textstack data/postgres-prod
          chmod 777 data/storage data/textstack

      - name: Build containers
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for API health
        run: |
          timeout 120 bash -c 'until curl -s http://localhost:8080/health; do sleep 5; done'

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Integration tests
        run: dotnet test tests/TextStack.IntegrationTests
        env:
          API_URL: http://localhost:8080

      - name: Stop services
        if: always()
        run: docker compose down

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          docker system prune -af

      - name: Create .env for CI
        run: |
          cat > .env << 'EOF'
          POSTGRES_USER=app
          POSTGRES_PASSWORD=changeme
          POSTGRES_DB=books
          JWT_SECRET=test-secret-key-for-ci-minimum-32-chars
          JWT_ISSUER=textstack.app
          JWT_AUDIENCE=textstack.app
          GOOGLE_CLIENT_ID=test
          ASPNETCORE_ENVIRONMENT=Development
          ENABLE_TEST_AUTH=true
          ADMIN_EMAIL=admin@textstack.app
          ADMIN_PASSWORD=admin
          EOF

      - name: Create volume dirs for non-root containers
        run: |
          mkdir -p data/storage data/textstack data/postgres-prod
          chmod 777 data/storage data/textstack

      - name: Build & start services
        run: docker compose up -d --build

      - name: Wait for API health
        run: |
          timeout 120 bash -c 'until curl -s http://localhost:8080/health; do sleep 5; done'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Get Playwright version
        id: pw-version
        working-directory: apps/web
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm -C apps/web exec playwright install-deps chromium

      - name: Clean stale dist
        run: rm -rf apps/web/dist

      - name: Run E2E tests
        working-directory: apps/web
        run: pnpm test:e2e
        env:
          CI: true
          API_URL: http://localhost:8080
          BASE_URL: http://localhost:5173
          ADMIN_URL: http://localhost:81

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/e2e/playwright-report/
          retention-days: 14

      - name: Dump API logs on failure
        if: failure()
        run: docker compose logs --no-color api migrator

      - name: Stop services
        if: always()
        run: docker compose down
