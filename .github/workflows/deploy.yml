name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback_commit:
        description: 'Commit SHA to rollback to (optional)'
        required: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_DIR: /home/vasyl/projects/onlinelib/textstack
  # Opt JS actions into Node 24 ahead of June 2026 forced cutover.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: self-hosted

    steps:
      - name: Pre-deploy backup
        run: |
          mkdir -p ~/backups/textstack
          DATE=$(date +%F-%H%M)
          docker exec textstack_db_prod pg_dump -U textstack_prod textstack_prod | gzip > ~/backups/textstack/pre-deploy-$DATE.sql.gz
          echo "Backup created: pre-deploy-$DATE.sql.gz"
          # Keep only 5 newest pre-deploy backups
          cd ~/backups/textstack && ls -1t pre-deploy-*.sql.gz 2>/dev/null | tail -n +6 | xargs -r rm -v

      - name: Pull latest code
        run: |
          cd $PROJECT_DIR
          git fetch origin
          if [ -n "${{ github.event.inputs.rollback_commit }}" ]; then
            git checkout ${{ github.event.inputs.rollback_commit }}
          else
            git checkout main
            git pull origin main
          fi

      - name: Build frontend
        # Reverted to default emptyOutDir=true after b0e6e38. The
        # --emptyOutDir=false attempt left a stale main bundle on disk
        # (index-Dj8T4aeH.js) whose dynamic-import() targets pointed at
        # lazy chunk hashes vite then regenerated — every visit to
        # /en/library, /en/highlights, etc. hit React.lazy 404 →
        # ErrorBoundary. Default (clean dist on each build) restores a
        # consistent hash set. Deploy-race window for broken-JS-in-stale-SSG
        # is back, but acceptable until a manifest-driven solution lands.
        run: |
          cd $PROJECT_DIR/apps/web
          pnpm install
          VITE_API_URL=/api VITE_STORAGE_URL=https://textstack.app VITE_CANONICAL_URL=https://textstack.app \
            pnpm build

      - name: Fix cache volume permissions
        # Container runs as uid 1000 but host-mounted cache dirs default to
        # root ownership. Without this, every translate/explain/tts cache
        # write logs a permission error. Idempotent.
        run: |
          cd $PROJECT_DIR
          make fix-permissions

      - name: Deploy containers
        # docker-compose.gpu.yml is a prod-only overlay that adds
        # `runtime: nvidia` + GPU device reservation to the ollama service.
        # CI runners don't have nvidia-container-toolkit, so it's NOT in
        # the default compose file (that would break the ci/docker job).
        run: |
          cd $PROJECT_DIR
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

      - name: Sync nginx config
        run: |
          cd $PROJECT_DIR
          # /etc/nginx/sites-available/textstack is vasyl:vasyl 664, so cp works
          # without sudo. Only nginx -t and reload need sudo (passwordless via
          # sudoers for nginx/systemctl).
          if ! diff -q infra/nginx/textstack.conf /etc/nginx/sites-available/textstack > /dev/null 2>&1; then
            echo "nginx config changed — syncing"
            cp infra/nginx/textstack.conf /etc/nginx/sites-available/textstack
            sudo nginx -t
            sudo systemctl reload nginx
            echo "nginx reloaded"
          else
            echo "nginx config unchanged — skip reload"
          fi

      - name: Wait for services
        run: sleep 30

      - name: Health check API
        run: |
          curl -sf http://localhost:8080/health || exit 1
          echo "API health check passed"

      - name: Queue SSG rebuild
        run: |
          curl -sf -X POST http://localhost:8080/internal/ssg/rebuild-all && echo "SSG rebuild queued" || echo "SSG rebuild queue failed (non-blocking)"

      - name: Health check frontend
        run: |
          curl -sf http://localhost:80 || exit 1
          echo "Frontend health check passed"

      - name: Verify SEO setup
        run: |
          echo "=== SPA serves real users ==="
          HEADER=$(curl -sf -o /dev/null -w '%{http_code}' -H "Host: textstack.app" http://localhost/en/)
          [ "$HEADER" = "200" ] && echo "SPA 200 OK" || { echo "SPA failed: $HEADER"; exit 1; }

          SPA_RENDER=$(curl -sf -I -H "Host: textstack.app" http://localhost/en/ | grep -i x-seo-render | tr -d '\r')
          echo "Real user: $SPA_RENDER"
          echo "$SPA_RENDER" | grep -qi "spa" || { echo "FAIL: real user not getting SPA"; exit 1; }

          echo "=== Bot detection active ==="
          BOT_RENDER=$(curl -sf -I -H "Host: textstack.app" -H "User-Agent: Googlebot/2.1" http://localhost/en/ | grep -i x-seo-render | tr -d '\r')
          echo "Bot: $BOT_RENDER"
          # Bot gets SSG if files exist, SPA fallback if not — both are OK post-deploy
          # But header MUST be present (proves nginx config is loaded)
          [ -n "$BOT_RENDER" ] && echo "Bot detection OK" || { echo "FAIL: x-seo-render header missing for bot"; exit 1; }

          echo "=== nginx bot map configured ==="
          grep -q 'map.*is_bot' /etc/nginx/sites-available/textstack || { echo "FAIL: bot map missing from nginx"; exit 1; }
          echo "Bot map found in nginx config"

      - name: Wait for SSG rebuild to complete
        run: |
          # Queue SSG rebuild step is async. Poll until the job finishes.
          # ssg-worker bind mount: ./apps/web/dist:/app/dist, so files atomic-swapped
          # by worker appear at $PROJECT_DIR/apps/web/dist/ssg on host.
          SSG_DIR=$PROJECT_DIR/apps/web/dist/ssg
          [ -d "$SSG_DIR" ] || { echo "No SSG dir yet — skipping wait"; exit 0; }

          DEADLINE=$(( $(date +%s) + 600 ))  # 10 min max
          SENTINEL="$SSG_DIR/en/books/dracula/index.html"
          until [ -f "$SENTINEL" ] && [ "$(find "$SENTINEL" -mmin -15)" ]; do
            [ "$(date +%s)" -ge "$DEADLINE" ] && { echo "Timeout waiting for SSG rebuild"; exit 0; }
            echo "Waiting for SSG rebuild… ($(date))"
            sleep 30
          done
          echo "SSG rebuild complete"

      - name: Validate SSG content
        run: |
          # Catch skeleton-only SSG files (empty <h1>, only skeleton divs). Silent-save bug
          # from before P0.5 left 247 stale shells on disk for 3 months.
          SSG_DIR=$PROJECT_DIR/apps/web/dist/ssg
          [ -d "$SSG_DIR" ] || { echo "SSG dir missing: $SSG_DIR (skipping — first deploy)"; exit 0; }

          TOTAL=$(find "$SSG_DIR" -name index.html | wc -l)
          [ "$TOTAL" -eq 0 ] && { echo "No SSG files yet (rebuild pending) — skip"; exit 0; }

          BAD=0
          SAMPLES=""
          while IFS= read -r f; do
            # Must have a real H1, and must not end with a bare skeleton div
            if ! grep -q '<h1' "$f" || grep -q '__skeleton"></div></div></div>$' "$f"; then
              BAD=$((BAD + 1))
              [ "$BAD" -le 3 ] && SAMPLES="$SAMPLES\n  $f"
            fi
          done < <(find "$SSG_DIR" -name index.html)

          echo "SSG files: $TOTAL, bad: $BAD"
          if [ "$BAD" -gt 0 ]; then
            printf "FAIL: %d SSG files lack <h1> or are skeleton-only. Samples:%b\n" "$BAD" "$SAMPLES"
            exit 1
          fi
          echo "SSG content validation passed"

          echo "All SEO checks passed"

      # NB: asset prune intentionally absent. A naive HTML+CSS reference
      # scan misses React.lazy() dynamic imports (they're string-literals
      # inside the main JS bundle, not <link rel=modulepreload>). The first
      # version of this step in 5e4070a deleted every lazy chunk on prod
      # (Highlights/Reader/Library/Stats/Vocabulary all 404'd until rollback
      # rebuilt). Disk growth from --emptyOutDir=false is ~600 KB/deploy;
      # add a manifest-driven cleanup as a Makefile target before re-adding
      # to the deploy critical path.

      - name: Restart systemd pollers
        # GH Actions runner job doesn't inherit a user DBus session, so plain
        # `systemctl --user` returned an error and fell through to the "not
        # installed" branch — silently skipping the restart for ~weeks. Set
        # XDG_RUNTIME_DIR explicitly so the user-systemd is reachable
        # (linger=yes is already enabled for vasyl, so /run/user/1000 exists
        # independent of login sessions).
        env:
          XDG_RUNTIME_DIR: /run/user/1000
        run: |
          systemctl --user restart seo-publish-poller && echo "SEO Publish poller restarted" || echo "SEO Publish poller restart FAILED"
          systemctl --user restart seo-backfill-poller && echo "SEO Backfill poller restarted" || echo "SEO Backfill poller restart FAILED (run: make seo-backfill-setup if not installed)"

      - name: Cleanup old images
        run: docker image prune -f
