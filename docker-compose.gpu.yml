# Production GPU overlay for the ollama service.
#
# Layered on top of docker-compose.yml on the prod box only. CI runners
# don't have nvidia-container-toolkit, so this file MUST NOT be the default —
# include it explicitly from the deploy workflow:
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
#
# Host pre-req (run once):
#   scripts/loadtest/install-nvidia-toolkit.sh
#
# Rollback: drop the `-f docker-compose.gpu.yml` from the deploy invocation
# and redeploy — Ollama falls back to CPU with no other side effects.
#
# Capacity note: GTX 1650 Ti Mobile has 4 GB VRAM. `gemma4:e2b` is ~7.2 GB
# on disk, so Ollama splits layers between GPU and CPU. Realistic speedup
# vs the pure-CPU baseline: 2-3×, not the ~10× a full-offload card gives.
services:
  ollama:
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]
